# Promtail lê o stdout de todos os containers Docker locais (via
# /var/run/docker.sock), parseia o JSON do structlog (saída de
# `src/shared/logging.py` — `JSONRenderer()` é o último processor),
# e empurra pro Loki como streams indexadas por label.
#
# Em Modo 2 (B3), cada host (pc1-davi, pc2-jm, abdon-workstation) roda
# seu próprio Promtail, todos apontando pro Loki central no pc1-davi.
#
# ATENÇÃO cardinalidade: `correlation_id` é alto-cardinal (1 por query).
# Promover como label do Loki funciona pra protótipo (volume baixo) mas
# em produção real encheria o índice. Pra reduzir custo, remover
# `correlation_id:` da seção `labels` abaixo — o campo continua dentro
# do JSON e pode ser filtrado via `{service="..."} | json | correlation_id="..."`.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            correlation_id: correlation_id
            service: service
      - labels:
          level:
          service:
          correlation_id:
