# Modo 1: DNS interno do compose (gateway, rerank-service, workers, rabbitmq).
# No Modo 2 (B3 distribuído via Tailscale), trocar os targets por IPs 100.x.y.z
# via override (`infra/prometheus/prometheus.modo2.yml`) montado em runtime.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: rag-distribuido

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: rerank-service
    metrics_path: /metrics
    static_configs:
      - targets: ["rerank-service:8081"]

  # Workers expõem /metrics via aiohttp standalone
  # (`src/shared/workers_metrics_server.py`, Task 3 do B3).
  # Mesma porta interna (9100) — o nome do container é o discriminador.
  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ingest-worker-doc:9100"
          - "ingest-worker-chunk:9100"
          - "query-worker:9100"

  # Plugin `rabbitmq_prometheus` (porta 15692). Já incluso na imagem
  # `rabbitmq:3-management`; ativado via env `RABBITMQ_PLUGINS` no compose.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Próprio Prometheus — útil pra confirmar que o scrape loop tá saudável.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
