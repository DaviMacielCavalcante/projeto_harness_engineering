[project]
name = "rag-distribuido"
version = "0.1.0"
description = "Tema 5 — RAG distribuído (Engenharia de Contexto e Harness aplicada à Programação Distribuída e Paralela)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "aio-pika>=9.5",
    "httpx>=0.28",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "pypdf>=5.1",
    "langdetect>=1.0.9",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "aiohttp>=3.10",
    "sentence-transformers>=5.5.0",
    "transformers>=5.8.1",
    "torch>=2.12.0",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: testes que requerem serviços externos (RabbitMQ, Qdrant, Ollama)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D100",  # missing module docstring (too noisy on small modules)
    "D104",  # missing __init__ docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
"__init__.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "aio_pika.*",
    "qdrant_client.*",
    "langdetect.*",
    "pypdf.*",
    "respx.*",
    "sentence_transformers.*",
    "transformers.*",
    "matplotlib.*",
]
ignore_missing_imports = true
