# Modo 1 do projeto: tudo num host só, DNS interno do compose (rabbitmq:5672, qdrant:6333, ...).
# Modo 2 (B3) vai dividir entre 3 PCs reais via Tailscale e usar IPs 100.x.y.z.
#
# Profiles:
#   - "all"    → sobe tudo (dev local)
#   - "server" → infra + gateway (PC1 no modo distribuído)
#   - "worker" → só workers (PC2/PC3 no modo distribuído)

name: rag-distribuido

# YAML anchor: bloco reutilizado pelos dois workers (ingest e query).
# A diferença entre eles é só WORKER_KIND no environment; o resto é idêntico.
x-worker-base: &worker-base
  build:
    context: .
    dockerfile: infra/docker/worker.Dockerfile
  env_file:
    - .env.local
  depends_on: 
    rabbitmq:
      condition: service_healthy
    qdrant:
      condition: service_started
    ollama: 
      condition: service_started
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rag-rabbitmq
    profiles: ["all", "server"]
    environment:
      # Habilita o plugin rabbitmq_prometheus (já incluso na imagem),
      # que expõe métricas no formato Prometheus em :15692/metrics.
      # Mantém `rabbitmq_management` (UI + API REST) ativo.
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    ports:
      - 5672:5672
      - 15672:15672
      - 15692:15692
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    profiles: ["all", "server"]
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    profiles: ["all", "server"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  ollama:
    image: ollama/ollama:0.23.2
    container_name: rag-ollama
    profiles: ["all", "server"]
    ports:
      - 11434:11434
    volumes:
      - ollama_models:/root/.ollama
    # GPU (opcional, descomente se tiver nvidia-container-toolkit):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # -------------------------------------------------------------------------
  # Aplicação
  # -------------------------------------------------------------------------

  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    container_name: rag-gateway
    profiles: ["all", "server"]
    env_file:
      - .env.local
    environment:
      SERVICE_NAME: gateway
    ports:
      - 8000:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rerank-service:
    build:
      context: .
      dockerfile: infra/docker/rerank.Dockerfile
    container_name: rag-rerank
    profiles: ["all", "server"]
    env_file:
      - .env.local
    environment:
      SERVICE_NAME: rerank-service
    ports:
      - 8081:8081
    restart: unless-stopped

  # B2: pipeline de ingestão dividido em dois consumers independentes.
  # Doc consumer (parse + chunk + publish na fila de chunks) é leve.
  # Chunk consumer (embed + upsert) é IO-bound caro — escala separado.
  ingest-worker-doc:
    <<: *worker-base
    container_name: rag-ingest-worker-doc
    profiles: ["all", "worker"]
    ports:
      - 9100:9100
    environment:
      WORKER_KIND: ingest
      INGEST_ROLE: documents
      SERVICE_NAME: ingest-worker-doc

  ingest-worker-chunk:
    <<: *worker-base
    container_name: rag-ingest-worker-chunk
    profiles: ["all", "worker"]
    ports:
      - 9101:9100
    environment:
      WORKER_KIND: ingest
      INGEST_ROLE: chunks
      SERVICE_NAME: ingest-worker-chunk

  query-worker:
    <<: *worker-base
    container_name: rag-query-worker
    profiles: ["all", "worker"]
    ports:
      - 9102:9100
    environment:
      WORKER_KIND: query
      SERVICE_NAME: query-worker

  # -------------------------------------------------------------------------
  # Observabilidade (B3 Task 4) — Prometheus + Grafana + Loki + Promtail.
  # Prometheus/Grafana/Loki vivem no `server` (PC1); Promtail vive em todo
  # host (server + worker) lendo o /var/run/docker.sock local.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rag-prometheus
    profiles: ["all", "server"]
    ports:
      - 9090:9090
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: rag-grafana
    profiles: ["all", "server"]
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: rag-loki
    profiles: ["all", "server"]
    ports:
      - 3100:3100
    volumes:
      - ./infra/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  # Roda em TODOS os hosts (server + worker). Descobre containers Docker
  # locais via /var/run/docker.sock; logs JSON do structlog viram streams
  # com labels `service`, `level`, `correlation_id` no Loki central.
  promtail:
    image: grafana/promtail:3.2.0
    container_name: rag-promtail
    profiles: ["all", "server", "worker"]
    volumes:
      - ./infra/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped

# -------------------------------------------------------------------------
# Volumes nomeados — Docker gerencia, persistem entre `down`/`up`.
# Pra apagar tudo de verdade: `docker compose down -v`.
# -------------------------------------------------------------------------
volumes:
  rabbitmq_data:
  qdrant_storage:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: rag-network
  
